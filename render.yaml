services:
  - type: web
    name: alldown-api
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DOWNLOAD_SIGNING_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: 1
      - key: TEMP_DIR
        value: /tmp/alldown
      - key: MAX_DOWNLOAD_SIZE_MB
        value: 200
      - key: MAX_CONCURRENT_DOWNLOADS
        value: 2
      - key: DOWNLOAD_TIMEOUT_SECONDS
        value: 300
      - key: ANALYZE_TIMEOUT_SECONDS
        value: 45
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 30
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: ALLOWED_DOWNLOAD_HOSTS
        value: ""
